[package]
name = "insider_alert_monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }  # Async runtime
reqwest = { version = "0.12", features = ["json", "gzip", "stream"] }  # Async HTTP
quick-xml = "0.27"  # Fast XML parsing
regex = "1"
redis = { version = "0.29", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
