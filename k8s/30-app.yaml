apiVersion: apps/v1
kind: Deployment
metadata:
  name: insider-alerts-app
  namespace: insider-alerts
  labels:
    app: insider-alerts
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: insider-alerts
  template:
    metadata:
      labels:
        app: insider-alerts
    spec:
      containers:
        - name: app
          image: your-registry/insider-alerts:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
